<div class="card shadow-xs border rounded-3 overflow-hidden found-words-card" [class.is-expanded]="isExpanded()">

    <button
        class="btn w-100 d-flex align-items-center justify-content-between p-3 border-0 text-start shadow-none toggle-button"
        (click)="toggleExpanded()" type="button" aria-label="Apri o chiudi lista parole trovate">

        <!-- Title and Icon -->
        <div class="d-flex align-items-center gap-2">
            <span class="fw-bold fs-6 text-dark m-0">Parole</span>
            <svg class="chevron text-secondary flex-shrink-0 ms-1" [class.open]="isExpanded()" fill="none"
                stroke="currentColor" viewBox="0 0 24 24" style="width: 14px; height: 14px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </div>

        <!-- Counter Badges -->
        <div class="d-flex align-items-center gap-2">
            <!-- Total Words Found (Solamente foundWords) -->
            <span class="badge bg-light text-dark border px-2.5 py-1.5 fw-bold">
                {{ foundWords().length }}/{{ totalPossibleWords() }}
            </span>

            <!-- Total Mielegrammi Found -->
            @if (totalPossibleMielegrammi() > 0) {
            <span class="badge bg-warning text-dark px-2.5 py-1.5 fw-black shadow-xs">
                {{ foundMielegrammi().length }}/{{ totalPossibleMielegrammi() }} MIELEGRAMMI
            </span>
            }
        </div>
    </button>

    <!-- Expanded Content -->
    @if (isExpanded()) {
    <div class="card-body border-top p-3 pt-2 animate-fade-in">
        @if (foundWords().length === 0) {
        <p class="text-muted text-center fst-italic small mb-0 py-2">
            Ancora nessuna parola trovata. Inizia a digitare!
        </p>
        } @else {
        <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0 words-grid">
            @for (word of foundWords(); track word) {
            <li>
                <span class="badge word-chip font-monospace" [class.mielegramma]="isMielegramma(word)">
                    {{ word }}
                </span>
            </li>
            }
        </ul>
        }
    </div>
    }
</div>
