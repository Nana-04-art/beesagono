<div class="toast-container position-fixed bottom-0 end-0 p-3 pointer-events-none" style="z-index: 1200;">
  @for (toast of toastService.toasts; track $index) {
  <div class="toast show align-items-center text-white border-0 mb-2 shadow-sm pointer-events-auto"
    [ngClass]="toast.classname" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        {{ toast.body }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" aria-label="Close"
        (click)="toastService.remove(toast)"></button>
    </div>
  </div>
  }
</div>
