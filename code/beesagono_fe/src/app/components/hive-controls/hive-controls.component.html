<div class="hive-controls" role="group" aria-label="Azioni di gioco">
    <button type="button" class="control-btn control-btn--secondary" (click)="onDelete()"
        title="Cancella l'ultima lettera">
        <i class="bi bi-backspace"></i>
    </button>

    <button type="button" class="control-btn control-btn--icon" (click)="onShuffle()" title="Mescola le lettere">
        <i class="bi bi-shuffle"></i>
    </button>

    <button type="button" class="control-btn control-btn--primary" (click)="onSubmit()"
        aria-label="Invia la parola inserita">
        Invio
    </button>
</div>
