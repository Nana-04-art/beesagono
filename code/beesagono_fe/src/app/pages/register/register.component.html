<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="card beesagono-card shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-hexagon-fill beesagono-icon display-4"></i>
                <h3 class="fw-bold mt-2 text-dark">Unisciti a Beesagono</h3>
                <p class="text-muted small">Crea un account per tracciare i tuoi punteggi e le tue statistiche</p>
            </div>

            <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome utente</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-person-fill text-warning"></i>
                        </span>
                        <input type="text" formControlName="username" class="form-control border-start-0"
                            [class.is-invalid]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
                            placeholder="Minimo 4 caratteri">
                        <div class="invalid-feedback">Il nome utente deve essere compreso tra 4 e 50 caratteri.</div>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-envelope-fill text-warning"></i>
                        </span>
                        <input type="email" formControlName="email" class="form-control border-start-0"
                            [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
                            placeholder="esempio@dominio.com">
                        <div class="invalid-feedback">Inserisci un indirizzo email valido.</div>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-lock-fill text-warning"></i>
                        </span>
                        <input #pwdInput type="password" formControlName="password"
                            class="form-control border-start-0 border-end-0"
                            [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
                            placeholder="Minimo 8 caratteri">
                        <button class="btn btn-outline-secondary border-start-0" type="button"
                            (click)="pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password'">
                            <i class="bi"
                                [ngClass]="pwdInput.type === 'password' ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                        </button>
                        <div class="invalid-feedback">La password deve contenere almeno 6 caratteri.</div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold">Conferma Password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="bi bi-shield-lock-fill text-warning"></i>
                        </span>
                        <input #confirmInput type="password" formControlName="confirmPassword"
                            class="form-control border-start-0"
                            [class.is-invalid]="registerForm.get('confirmPassword')?.touched && registerForm.hasError('passwordMismatch')"
                            placeholder="Ripeti la password">
                        <div class="invalid-feedback">Le password non corrispondono.</div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-warning text-dark fw-bold btn-lg shadow-sm beesagono-btn"
                        [disabled]="registerForm.invalid || isLoading()">
                        @if (!isLoading()) {
                        <i class="bi bi-person-plus-fill me-2"></i> Registrati ora
                        }
                        @if (isLoading()) {
                        <span class="spinner-border spinner-border-sm me-2"></span> Creazione account...
                        }
                    </button>
                </div>
            </form>
        </div>

        <div class="card-footer bg-transparent border-0 pb-4 text-center">
            <span class="text-muted small">Hai già un account?</span>
            <a routerLink="/login" class="ms-1 fw-bold text-warning-emphasis text-decoration-none">
                Accedi qui
            </a>
        </div>
    </div>
</div>
