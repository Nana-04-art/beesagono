<div class="container d-flex justify-content-center align-items-center min-vh-100 py-3 px-2 px-sm-3">
    <div class="card beesagono-card shadow-lg w-100" style="max-width: 420px;">
        <div class="card-body p-3 p-sm-4">
            <div class="text-center mb-3 mb-sm-4">
                <div class="beesagono-wrapper display-4 mx-auto">
                    <i class="bi bi-hexagon-fill beesagono-icon"></i>
                    <span class="beesagono-emoji">🐝</span>
                </div>
                <h3 class="fw-bold mt-2 text-dark fs-4 fs-sm-3">Benvenuto su Beesagono</h3>
                <p class="text-muted small mb-0">Accedi per continuare a giocare</p>
            </div>

            <!-- Google Sign In Button Container -->
            <div class="d-flex justify-content-center mb-3">
                <div id="googleBtn"></div>
            </div>

            <div class="d-flex align-items-center my-3">
                <hr class="flex-grow-1 m-0 text-muted" />
                <span class="px-2 text-muted extra-small fw-semibold">OPPURE</span>
                <hr class="flex-grow-1 m-0 text-muted" />
            </div>

            <form (ngSubmit)="onSubmit()">
                <!-- Username or Email -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username o Email</label>
                    <div class="input-group input-group-sm-md has-validation">
                        <span class="input-group-text bg-light border-end-0 px-2.5">
                            <i class="bi bi-person-fill text-warning"></i>
                        </span>
                        <input type="text" name="usernameOrEmail" [ngModel]="usernameOrEmail()"
                            (ngModelChange)="usernameOrEmail.set($event)" #userInput="ngModel"
                            class="form-control border-start-0 px-2"
                            [class.is-invalid]="userInput.invalid && userInput.touched" required
                            placeholder="Username o email">
                        <div class="invalid-feedback">Username o email obbligatori.</div>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group input-group-sm-md has-validation">
                        <span class="input-group-text bg-light border-end-0 px-2.5">
                            <i class="bi bi-lock-fill text-warning"></i>
                        </span>
                        <input #passwordInput type="password" name="password" [ngModel]="password()"
                            (ngModelChange)="password.set($event)" #passInput="ngModel"
                            class="form-control border-start-0 border-end-0 px-2"
                            [class.is-invalid]="passInput.invalid && passInput.touched" required placeholder="Password">
                        <button class="btn btn-outline-secondary border-start-0 px-2.5" type="button"
                            (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'">
                            <i class="bi"
                                [ngClass]="passwordInput.type === 'password' ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                        </button>
                        <div class="invalid-feedback">La password è obbligatoria.</div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit"
                        class="btn btn-warning text-dark fw-bold btn-lg shadow-sm beesagono-btn py-2.5 fs-6"
                        [disabled]="!usernameOrEmail() || !password() || isLoading()">
                        @if (!isLoading()) {
                        <i class="bi bi-box-arrow-in-right me-2"></i> Accedi
                        }
                        @if (isLoading()) {
                        <span class="spinner-border spinner-border-sm me-2"></span> Accesso in corso...
                        }
                    </button>
                </div>
            </form>
        </div>

        <div class="card-footer bg-transparent border-0 pb-3 pb-sm-4 text-center">
            <span class="text-muted small">Non hai un account?</span>
            <a routerLink="/register" class="ms-1 fw-bold text-warning-emphasis text-decoration-none small">
                Registrati ora
            </a>
        </div>
    </div>
</div>

<!-- Modal for New Google User Username Selection -->
@if (googleAuth.pendingGoogleUser()) {
<div class="modal-backdrop-custom" (click)="cancelGoogleModal()"></div>

<div class="modal-wrapper-custom d-flex align-items-center justify-content-center p-2 p-sm-3" role="dialog"
    aria-modal="true" aria-labelledby="googleUsernameTitle" (click)="$event.stopPropagation()">
    <div class="google-modal-card rounded-4 shadow-lg d-flex flex-column w-100 p-3 p-sm-4 overflow-y-auto"
        style="max-width: 26rem; max-height: calc(100dvh - 1.5rem);">

        <div class="text-center mb-3">
            <h4 class="fw-bold mb-1 fs-5 fs-sm-4 modal-title-text" id="googleUsernameTitle">Scegli il tuo Username</h4>
            <p class="text-muted small mb-0">
                Completa il tuo profilo per <br class="d-block d-sm-none"><strong class="text-warning">{{
                    googleAuth.pendingGoogleUser()?.email }}</strong>
            </p>
        </div>

        <form (ngSubmit)="googleAuth.completeGoogleRegistration()">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill text-warning"></i>
                    </span>
                    <input #usernameInputRef type="text" name="googleUsername" [ngModel]="googleAuth.selectedUsername()"
                        (ngModelChange)="googleAuth.selectedUsername.set($event)" class="form-control"
                        placeholder="Scegli un username univoco" required autocomplete="off">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <button #cancelBtnRef type="button" class="btn btn-outline-secondary px-3"
                    (click)="cancelGoogleModal()">
                    Annulla
                </button>
                <button #completeBtnRef type="submit" class="btn btn-warning text-dark fw-bold px-3"
                    [disabled]="googleAuth.isLoading() || !googleAuth.selectedUsername().trim()">
                    @if (!googleAuth.isLoading()) {
                    Completa Registrazione
                    }
                    @if (googleAuth.isLoading()) {
                    <span class="spinner-border spinner-border-sm me-2"></span> Salvataggio...
                    }
                </button>
            </div>
        </form>
    </div>
</div>
}
